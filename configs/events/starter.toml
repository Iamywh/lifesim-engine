[event_settings]
max_events_per_week = 1
event_probability = 0.45

[[events]]
event_id = "minor_transit_disruption"
version = "1"
category = "city"
base_weight = 1.0
cooldown_weeks = 2
tags = ["city", "transport"]
title = "Minor transit disruption"
summary = "A local transit delay makes the city feel a little harder to navigate."
time_pressure = 0.55

[[events.conditions]]
type = "numeric_lte"
path = "social.city_familiarity"
value = 40.0

[[events.weight_modifiers]]
type = "numeric_lte"
path = "social.city_familiarity"
value = 20.0
multiplier = 1.6

[[events.options]]
option_id = "wait_and_adapt"
label = "Wait and adapt"
summary = "Use the delay to learn an alternate route without spending extra money."
estimated_cost = "0.00"
time_cost_hours = 1.0
energy_cost = 12.0
short_term_value = -0.1
future_value = 0.3
perceived_risk = 0.1
uncertainty = 0.3
social_value = 0.0
social_pressure = 0.0
autonomy_value = 0.2
learning_value = 0.5
health_value = -0.1
comfort_value = -0.2
goal_tags = ["city", "finance", "independence"]

[[events.options]]
option_id = "pay_for_faster_transport"
label = "Pay for faster transport"
summary = "Spend money on a faster route and protect the rest of the day."
estimated_cost = "14.00"
time_cost_hours = 0.25
energy_cost = 4.0
short_term_value = 0.4
future_value = -0.1
perceived_risk = 0.05
uncertainty = 0.1
social_value = 0.0
social_pressure = 0.0
autonomy_value = 0.1
learning_value = 0.0
health_value = 0.0
comfort_value = 0.3
goal_tags = ["city"]

[[events]]
